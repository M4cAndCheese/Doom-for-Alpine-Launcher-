<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doom</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --c-bg: #1a1a24;
    --c-primary: #d4a574;
    --c-fire: #ff6b9d;
    --c-use: #6ba3ff;
    --c-text: #b8c5d6;
    --c-accent: #00d9ff;
  }
  html, body { margin: 0; height: 100%; background: var(--c-bg); overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #000; image-rendering: crisp-edges; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--c-accent); font: 18px sans-serif; z-index: 10; }
  #log { position: fixed; left: 8px; top: 8px; right: 8px; z-index: 30; color: var(--c-fire); font: 11px monospace; white-space: pre-wrap; pointer-events: none; max-height: 40%; overflow: hidden; opacity: 0.85; }
  
  /* Controles */
  .b { position: fixed; z-index: 2; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; box-sizing: border-box;
       font-family: sans-serif; font-weight: 700; color: var(--c-text); border: 0; border-radius: 50%; touch-action: none;
       background: linear-gradient(135deg, rgba(220,180,140,0.9) 0%, rgba(180,140,100,0.85) 100%);
       box-shadow: inset 0 -4px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3), 0 4px 12px rgba(0,0,0,0.6), 0 0 0 2px rgba(212,165,116,0.4);
       text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
       font-size: 14px; transition: all 0.05s ease; }
  .b.sq { border-radius: 14px; }
  .b.fire { color: var(--c-fire); --glow: var(--c-fire); }
  .b.use { color: var(--c-use); --glow: var(--c-use); }
  .b.on { transform: translate(-50%, -50%) scale(0.92); box-shadow: inset 0 4px 8px rgba(0,0,0,0.7), 0 2px 6px rgba(0,0,0,0.8), 0 0 0 2px rgba(212,165,116,0.3); }

  .row label { font-size: 11px; color: var(--c-accent); text-transform: uppercase; letter-spacing: 0.5px; }

               cursor: pointer; transition: all 0.2s; }

  .row button:active { transform: translateY(0); }

  #saves button { width: 100%; padding: 6px; margin: 4px 0; background: var(--c-use); color: var(--c-bg); border: 0; border-radius: 4px; 
                 cursor: pointer; font: 10px sans-serif; font-weight: 600; }
  #saves button:hover { opacity: 0.9; }

<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="msg">Toca para empezar</div>
<div id="log"></div>
<div id="gear">⚙</div>
<div id="panel"></div>
<div id="saves"></div>

<script>
/* ---------- Logging ---------- */
const logEl = document.getElementById('log'), msg = document.getElementById('msg');
const lines = [];
let logOn = true;
function L(t) {
  const s = String(t).trim();
  if (s) { lines.push(s); if (lines.length > 12) lines.shift(); }
  if (logOn) logEl.textContent = lines.join('\n');
}
window.onerror = (m, s, l) => { logOn = true; L('ERROR: ' + m + ' (' + (s || '').split('/').pop() + ':' + l + ')'); };
window.addEventListener('unhandledrejection', e => { logOn = true; L('RECHIZO: ' + (e.reason?.message || e.reason)); });

/* ---------- Motor (Crispy Doom) ---------- */
const CFG = 'fullscreen 0\naspect_ratio_correct 1\ninteger_scaling 0\nvga_porch_flash 0\nuse_mouse 0\ngrabmouse 0\n';
const XCFG = 'crispy_widescreen 1\ncrispy_hires 1\ncrispy_uncapped 0\ncrispy_smoothscaling 1\n';

var Module = {
  canvas: document.getElementById('canvas'),
  print: t => L(t),
  printErr: t => L(t),
  async onRuntimeInitialized() {
    try {
      msg.textContent = 'Preparando guardados...';
      L('Inicializando Crispy Doom');
      Module.ccall('alpine_mount', null, [], []);
      const A = Module.alpineFS;
      await new Promise(r => A.sync(true, r));
      L('Buscando WAD');
      msg.textContent = 'Cargando WAD...';
      let name = null, data = null;
      for (const n of ['doom.wad', 'DOOM.WAD', 'doom1.wad', 'DOOM1.WAD']) {
        try { const r = await fetch('wad/' + n); if (r.ok) { data = new Uint8Array(await r.arrayBuffer()); name = n; L('WAD encontrado: ' + n); break; } } catch (e) {}
      }
      if (!name) { msg.textContent = 'Falta doom.wad en wad/'; L('ERROR: No se encontró WAD'); return; }
      A.write('/' + name, data);
      if (!A.exists('/saves/default.cfg')) A.write('/saves/default.cfg', CFG);
      if (!A.exists('/saves/crispy-doom.cfg')) A.write('/saves/crispy-doom.cfg', XCFG);
      L('Configuración lista. Toca para iniciar');
      msg.textContent = 'Toca para empezar';
      let started = false;
      const go = async () => {
        if (started) return;
        started = true;
        msg.remove();
        logOn = false;
        setTimeout(() => { logEl.textContent = ''; }, 12000);
        try {
          L('Iniciando Doom');
          Module.callMain(['-iwad', '/' + name, '-config', '/saves/default.cfg', '-extraconfig', '/saves/crispy-doom.cfg',
            '-savedir', '/saves/', '-window', '-geometry', innerWidth + 'x' + innerHeight]);
        } catch (e) { if (String(e).indexOf('unwind') < 0) { logOn = true; L('ERROR init: ' + e); } }
        setInterval(() => A.sync(false), 5000);
      };
      msg.addEventListener('pointerup', go);
      msg.addEventListener('click', go);
      // Unlock audio
      ['pointerup', 'touchend', 'click', 'keydown'].forEach(t => addEventListener(t, () => {
        try { const c = Module.SDL2?.audioContext; if (c && c.state !== 'running') c.resume(); } catch (e) {}
      }, true));
    } catch (e) { msg.textContent = 'Error: ' + String(e).slice(0, 50); L('ERROR: ' + e); }
  }
};

/* ---------- Entrada táctil analógica ---------- */
const cnt = {};
function key(id, p) {
  const before = cnt[id] || 0;
  const after = Math.max(0, before + (p ? 1 : -1));
  cnt[id] = after;
  if ((before === 0) !== (after === 0)) {
    try { Module.ccall('alpine_key', null, ['number', 'number'], [id, after > 0 ? 1 : 0]); } catch (e) {}
  }
}
function releaseAll() { for (const id in cnt) { if (cnt[id] > 0) { cnt[id] = 1; key(+id, 0); } } }

/* Joystick analógico */
const CTRL = [
  { id: 'joy', t: 'joy', label: 'Joystick', x: .15, y: .66, size: 160 },
  { id: 'fire', k: 4, label: 'FUEGO', cls: 'fire', x: .88, y: .64, size: 110 },
  { id: 'use', k: 5, label: 'USAR', cls: 'use', x: .75, y: .84, size: 70 },
  { id: 'run', k: 6, label: 'CORRER', x: .75, y: .56, size: 70 },
  { id: 'esc', k: 10, label: 'MENÚ', x: .96, y: .10, size: 54, sq: 1 },
  { id: 'ok', k: 9, label: 'OK', x: .88, y: .10, size: 54, sq: 1 },
  { id: 'map', k: 11, label: 'MAPA', x: .80, y: .10, size: 54, sq: 1 },
];
for (let i = 0; i < 7; i++) CTRL.push({ id: 'w' + i, k: 20 + i, label: '' + (i + 1), x: .04 + i * .058, y: .10, size: 48, sq: 1 });

const d = {};
function load() {
  const s = localStorage.getItem('doom-layout');
  if (s) Object.assign(d, JSON.parse(s));
  CTRL.forEach(c => {
    if (!d[c.id]) d[c.id] = { x: c.x, y: c.y, size: c.size, op: 1 };
    if (!d.op) d.op = 1;
  });
}
function save() { localStorage.setItem('doom-layout', JSON.stringify(d)); }
load();

function apply(c) {
  const el = document.getElementById(c.id);
  if (!el) return;
  const l = d[c.id], W = innerWidth, H = innerHeight;
  const s = (l.size / 100) * Math.min(W, H);
  el.style.left = (l.x * W) + 'px';
  el.style.top = (l.y * H) + 'px';
  el.style.width = s + 'px';
  el.style.height = s + 'px';
  el.style.opacity = l.op || 1;
  el.style.fontSize = s * (c.label.length > 4 ? 0.2 : c.label.length > 2 ? 0.25 : 0.32) + 'px';
}

CTRL.forEach(c => {
  const el = document.createElement('button');
  el.id = c.id;
  el.className = 'b' + (c.sq ? ' sq' : '') + (c.t === 'joy' ? ' joy' : '') + (c.cls ? ' ' + c.cls : '');
  if (c.t === 'joy') { el.innerHTML = '<div class="knob"></div>'; }
  else { el.textContent = c.label; }
  el.dataset.id = c.id;
  el.dataset.k = c.k;
  document.body.appendChild(el);
  apply(c);
});

// Joystick
const joy = document.getElementById('joy'), c = { st: { 2: 0, 3: 0, 7: 0, 8: 0 }, id: null, x0: 0, y0: 0 };
const th = 0.15, max = joy.offsetWidth * 0.45;

function joySet(id, val) {
  if (c.st[id] !== val) { c.st[id] = val; key(id, val); }
}

joy.addEventListener('pointerdown', e => {
  if (editing || c.id !== null) return;
  e.preventDefault();
  joy.setPointerCapture(e.pointerId);
  c.id = e.pointerId;
  c.x0 = e.clientX;
  c.y0 = e.clientY;
});

joy.addEventListener('pointermove', e => {
  if (e.pointerId !== c.id || !c.id) return;
  const W = innerWidth, H = innerHeight, jx = d[joy.id].x * W, jy = d[joy.id].y * H;
  const dx = (e.clientX - jx) / max, dy = (jy - e.clientY) / max;
  const mag = Math.sqrt(dx * dx + dy * dy);
  const mx = mag > 1 ? dx / mag : dx, my = mag > 1 ? dy / mag : dy;
  Module.ccall('alpine_move', null, ['number', 'number'], [mx, my]);
  const rad = Math.atan2(dy, dx);
  joySet(7, dx < -th ? 1 : 0);
  joySet(8, dx > th ? 1 : 0);
  joySet(2, dy > th ? 1 : 0);
  joySet(3, dy < -th ? 1 : 0);
});

const joyEnd = e => {
  if (e.pointerId !== c.id) return;
  c.id = null;
  Module.ccall('alpine_move', null, ['number', 'number'], [0, 0]);
  [2, 3, 7, 8].forEach(i => joySet(i, 0));
};
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);

// Botones
document.querySelectorAll('.b').forEach(el => {
  if (el.id === 'joy') return;
  el.addEventListener('pointerdown', e => {
    if (editing) return;
    e.preventDefault();
    const k = parseInt(el.dataset.k);
    key(k, 1);
    el.classList.add('on');
  });
  el.addEventListener('pointerup', e => {
    const k = parseInt(el.dataset.k);
    key(k, 0);
    el.classList.remove('on');
  });
  el.addEventListener('pointercancel', e => {
    const k = parseInt(el.dataset.k);
    key(k, 0);
    el.classList.remove('on');
  });
});

// Cámara (arrastra a la derecha)
const cam = document.createElement('div');
cam.style.position = 'fixed';
cam.style.right = '0';
cam.style.top = '0';
cam.style.width = '45%';
cam.style.height = '100%';
cam.style.zIndex = '1';
cam.style.touchAction = 'none';
document.body.appendChild(cam);

const cs = { id: null, x0: 0, l: 0, r: 0, f: 0 };
function camSet(l, r, f) {
  if (cs.l !== l) { cs.l = l; key(0, l); }
  if (cs.r !== r) { cs.r = r; key(1, r); }
  if (cs.f !== f) { cs.f = f; key(6, f); }
}

cam.addEventListener('pointerdown', e => {
  if (editing || cs.id !== null) return;
  e.preventDefault();
  cam.setPointerCapture(e.pointerId);
  cs.id = e.pointerId;
  cs.x0 = e.clientX;
});

cam.addEventListener('pointermove', e => {
  if (e.pointerId !== cs.id) return;
  const dx = e.clientX - cs.x0, a = Math.abs(dx), t = a > 20;
  camSet(t && dx < 0 ? 1 : 0, t && dx > 0 ? 1 : 0, a > 100 ? 1 : 0);
  Module.ccall('alpine_look', null, ['number'], [dx * 0.3]);
});

const camEnd = e => { if (e.pointerId !== cs.id) return; cs.id = null; camSet(0, 0, 0); };
cam.addEventListener('pointerup', camEnd);
cam.addEventListener('pointercancel', camEnd);

/* ---------- Modo edición ---------- */
let op = 1, editing = false, sel = null, drag = null;
const panel = document.getElementById('panel');

function toggleEdit() {
  editing = !editing;
  if (editing) {
    panel.style.display = 'block';
    CTRL.forEach(c => {
      if (c.t !== 'joy') {
        document.getElementById(c.id).style.cursor = 'grab';
      }
    });
  } else {
    panel.style.display = 'none';
    CTRL.forEach(c => {
      if (c.t !== 'joy') {
        document.getElementById(c.id).style.cursor = 'pointer';
      }
    });
  }
  save();
}

document.getElementById('gear').addEventListener('click', toggleEdit);

CTRL.forEach(c => {
  if (c.t === 'joy') return;
  const el = document.getElementById(c.id);
  el.addEventListener('pointerdown', e => {
    if (!editing) return;
    e.preventDefault();
    sel = c;
    drag = { x: e.clientX, y: e.clientY, x0: d[c.id].x, y0: d[c.id].y };
    el.setPointerCapture(e.pointerId);
    updatePanel();
  });
});

document.addEventListener('pointermove', e => {
  if (!drag || !sel) return;
  const W = innerWidth, H = innerHeight;
  d[sel.id].x = Math.max(0, Math.min(1, drag.x0 + (e.clientX - drag.x) / W));
  d[sel.id].y = Math.max(0, Math.min(1, drag.y0 + (e.clientY - drag.y) / H));
  apply(sel);
});

document.addEventListener('pointerup', () => { drag = null; if (sel) { updatePanel(); save(); sel = null; } });

function updatePanel() {
  if (!sel) return;
  panel.innerHTML = `
    <div class="row">
      <label>Tamaño: <span id="ssize"></span>%</label>
      <input type="range" id="psize" min="30" max="200" value="${d[sel.id].size}">
    </div>
    <div class="row">
      <label>Opacidad: <span id="sop"></span>%</label>
      <input type="range" id="pop" min="10" max="100" value="${(d[sel.id].op || 1) * 100}">
    </div>
    <div class="row">
      <button id="prst">Restablecer</button>
      <button id="pdone">Listo</button>
    </div>
  `;
  document.getElementById('psize').oninput = e => {
    d[sel.id].size = parseInt(e.target.value);
    document.getElementById('ssize').textContent = d[sel.id].size;
    apply(sel);
    save();
  };
  document.getElementById('pop').oninput = e => {
    d[sel.id].op = parseInt(e.target.value) / 100;
    document.getElementById('sop').textContent = parseInt(e.target.value);
    apply(sel);
    save();
  };
  document.getElementById('prst').onclick = () => {
    d[sel.id] = { x: CTRL.find(c => c.id === sel.id).x, y: CTRL.find(c => c.id === sel.id).y, size: CTRL.find(c => c.id === sel.id).size, op: 1 };
    apply(sel);
    updatePanel();
    save();
  };
  document.getElementById('pdone').onclick = () => { sel = null; updatePanel(); toggleEdit(); };
  document.getElementById('ssize').textContent = d[sel.id].size;
  document.getElementById('sop').textContent = Math.round((d[sel.id].op || 1) * 100);
}

addEventListener('resize', () => { CTRL.forEach(apply); });
</script>
</body>
</html>
