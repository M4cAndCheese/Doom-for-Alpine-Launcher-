<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOOM</title>
<link rel="manifest" href="manifest.json">
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #canvas{position:fixed;background:#000}
  #log{position:fixed;left:8px;top:8px;right:8px;z-index:30;color:#fc6;font:12px monospace;white-space:pre-wrap;pointer-events:none;max-height:60%;overflow:hidden;text-shadow:0 0 3px #000}
  #jz{position:fixed;top:0;left:0;width:45%;height:100%;z-index:1;touch-action:none}
  #cam{position:fixed;top:0;right:0;width:55%;height:100%;z-index:1;touch-action:none}
  #msg{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;color:#fc6;font:20px sans-serif;text-align:center;padding:20px;background:#000}
  .b{position:fixed;z-index:2;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;box-sizing:border-box;
     font-family:sans-serif;font-weight:700;letter-spacing:.3px;color:rgba(255,255,255,.7);
     border:2px solid rgba(255,255,255,.2);border-radius:50%;touch-action:none;
     background:rgba(38,38,42,.55);box-shadow:none;text-shadow:none}
  .b.sq{border-radius:10px}
  .b.pk{background:rgba(140,42,42,.6);border-color:rgba(255,150,150,.28)}
  .b.bl{background:rgba(48,76,134,.6);border-color:rgba(150,178,240,.28)}
  .b.on{transform:translate(-50%,-50%) scale(.94);background:rgba(95,95,104,.72)}
  .b.pk.on{background:rgba(185,58,58,.78)}
  .b.bl.on{background:rgba(68,106,178,.78)}
  .joy{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);box-shadow:none;border-radius:50%}
  .knob{position:absolute;left:50%;top:50%;width:48%;height:48%;border-radius:50%;background:rgba(255,255,255,.28);pointer-events:none}
  .edit .b{outline:2px dashed #fc6}
  .edit .b.sel{outline:3px solid #fff;box-shadow:0 0 12px #fc6}
  #gear{position:fixed;left:50%;top:6px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);font:20px sans-serif;display:flex;align-items:center;justify-content:center;z-index:5;box-sizing:border-box}
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:rgba(20,20,20,.94);
         color:#fff;font:14px sans-serif;border:1px solid #fc6;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;
         width:320px;max-height:90vh;overflow:auto}
  #panel label{display:flex;align-items:center;gap:8px}
  #panel input[type=range]{flex:1}
  #panel .row{display:flex;gap:8px}
  #panel button{flex:1;padding:8px;border-radius:8px;border:0;background:#444;color:#fff;font:14px sans-serif}
  #pdone{background:#c80!important}
</style></head><body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="log"></div>
<div id="msg">Cargando…</div>
<div id="gear">⚙</div>
<div id="panel" hidden>
  <b id="pname">Toca un control para editarlo</b>
  <label>Tamaño <input id="psize" type="range" min="50" max="220" value="100"></label>
  <label>Opacidad <input id="pop" type="range" min="20" max="100" value="100"></label>
  <label>Sens. cámara <input id="psens" type="range" min="1" max="20" value="6"></label>
  <div class="row"><button id="phide">Ocultar</button><button id="preset">Restablecer</button></div>
  <div class="row"><button id="pcam">Cámara: analógica</button></div>
  <div class="row"><button id="plog">Ver registro del motor</button></div>
  <div class="row"><button id="psnd">Ver registro de sonido y guardado</button></div>
  <div class="row"><button id="pfs">Pantalla completa</button></div>
  <div class="row"><button id="pscr">Pantalla</button></div>
  <div class="row"><button id="pdone">Listo</button></div>
  <small>Arrastra cada control para moverlo.</small>
</div>
<script src="/__alpine/host.js"></script>
<script>
// Sin cambios globales del launcher (setStatusBar/setOrientation afectaban a todas las apps).

/* ---------- Motor (Crispy Doom) ---------- */
const msg = document.getElementById('msg'), logEl = document.getElementById('log'), cvs = document.getElementById('canvas');
const lines = [];
let logOn = true, logFilter = null;
// Red de seguridad: si la carga se queda, quitar la capa negra para que se vean los controles.
setTimeout(() => { if (document.getElementById('msg')) { L('Aviso: la carga tardó demasiado; se quita la pantalla de carga.'); document.getElementById('msg').remove(); } }, 15000);
function showLog() { const v = logFilter ? lines.filter(l => logFilter.test(l)) : lines; logEl.textContent = v.slice(-22).join('\n'); }
function L(t) {
  t = String(t); lines.push(t); if (lines.length > 600) lines.shift();
  if (/error|fail|cannot|could not|unable|abort/i.test(t)) logOn = true;
  if (logOn) showLog();
}
window.onerror = (m, s, l) => L('ERROR: ' + m + ' (' + String(s || '').split('/').pop() + ':' + l + ')');
window.addEventListener('unhandledrejection', e => L('ERROR: ' + (e.reason && e.reason.message || e.reason)));

// El canvas conserva siempre la proporción real de la imagen: nunca se estira.
function syncCanvas() {
  const w = cvs.width, h = cvs.height;
  if (w > 0 && h > 0) {
    const s = Math.min(innerWidth / w, innerHeight / h), cw = w * s, ch = h * s;
    const st = cvs.style;
    st.setProperty('width', cw + 'px', 'important'); st.setProperty('height', ch + 'px', 'important');
    st.setProperty('left', (innerWidth - cw) / 2 + 'px', 'important'); st.setProperty('top', (innerHeight - ch) / 2 + 'px', 'important');
  }
  requestAnimationFrame(syncCanvas);
}
syncCanvas();

// El audio del navegador se activa con el primer toque.
function unlockAudio() { try { const c = Module.SDL2 && Module.SDL2.audioContext; if (c && c.state !== 'running') c.resume(); } catch (e) {} }
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => addEventListener(t, unlockAudio, true));
document.addEventListener('visibilitychange', unlockAudio);

function cfgMain() {
  return ['fullscreen 0', 'aspect_ratio_correct 1', 'integer_scaling 0', 'vga_porch_flash 0', 'use_mouse 0', 'grabmouse 0',
    'snd_sfxdevice 3', 'snd_musicdevice 3', 'snd_samplerate 44100', 'snd_maxslicetime_ms 70', 'sfx_volume 12', 'music_volume 10'].join('\n') + '\n';
}
// Pantalla panorámica automática según la proporción del teléfono.
function curMode() { return localStorage.getItem('doom1-mode') || 'full'; }
function cfgCrispy() {
  const ws = curMode() === '43' ? 0 : 1; // 1 = Match screen: usa la proporción exacta de tu pantalla (Crispy admite hasta 24:9)
  return ['crispy_widescreen ' + ws, 'crispy_hires 1', 'crispy_uncapped 0', 'crispy_smoothscaling 1',
    'crispy_brightmaps 1', 'crispy_translucency 1', 'music_pack_path /music'].join('\n') + '\n';
}
// "Match screen" lee el tamaño de pantalla del dispositivo: lo igualamos a la ventana para que la imagen sea exacta.
try {
  const sc = () => Math.max(1, Math.min(window.devicePixelRatio || 1, 2560 / innerWidth, 2.5));
  Object.defineProperty(screen, 'width', { get: () => Math.round(innerWidth * sc()), configurable: true });
  Object.defineProperty(screen, 'height', { get: () => Math.round(innerHeight * sc()), configurable: true });
} catch (e) {}
function geometry() {
  const s = Math.max(1, Math.min(window.devicePixelRatio || 1, 2560 / innerWidth, 2.5));
  return Math.round(innerWidth * s) + 'x' + Math.round(innerHeight * s);
}

const fetchWithTimeout = (url, ms) => { const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms); return fetch(url, { signal: ac.signal }).finally(() => clearTimeout(t)); };
var Module = {
  canvas: cvs,
  print: t => L(t),
  printErr: t => L(t),
  async onRuntimeInitialized() {
    try {
      Module.ccall('alpine_mount', null, [], []);
      const A = Module.alpineFS;
      // IndexedDB puede no responder en el WebView de Alpine: no bloquear el arranque por los guardados.
      await Promise.race([new Promise(r => A.sync(true, r)), new Promise(r => setTimeout(r, 4000))]);
      msg.textContent = 'Cargando WAD…';
      let name = null, data = null;
      for (const n of ['doom.wad', 'DOOM.WAD', 'doom1.wad', 'DOOM1.WAD']) {
        try { msg.textContent = 'Leyendo wad/' + n + '…'; const r = await fetchWithTimeout('wad/' + n, 60000); if (r.ok) { data = new Uint8Array(await r.arrayBuffer()); name = n; break; } L('wad/' + n + ': HTTP ' + r.status); } catch (e) { L('wad/' + n + ': ' + e); msg.textContent = 'No se pudo leer wad/' + n + ': ' + e; }
      }
      if (!name) { msg.textContent = 'Falta wad/doom.wad dentro del zip'; return; }
      A.write('/' + name, data);
      A.write('/doom1-saves/default.cfg', cfgMain());
      A.write('/doom1-saves/crispy-doom.cfg', cfgCrispy());
      // Música: pistas OGG/MP3 opcionales en wad/music/ (lista en wad/music/list.txt).
      try {
        const lr = await fetch('wad/music/list.txt');
        if (lr.ok) {
          try { Module.FS.mkdir('/music'); } catch (e) {}
          const names = (await lr.text()).split(/\r?\n/).map(x => x.trim()).filter(Boolean);
          let ok = 0;
          for (const n of names) {
            try { const f = await fetch('wad/music/' + n); if (f.ok) { A.write('/music/' + n, new Uint8Array(await f.arrayBuffer())); ok++; } } catch (e) {}
          }
          L('Música: ' + ok + ' de ' + names.length + ' pistas');
        }
      } catch (e) { L('Música: error al cargar pack'); }
      msg.remove();
      try {
        Module.callMain(['-iwad', '/' + name, '-config', '/doom1-saves/default.cfg', '-extraconfig', '/doom1-saves/crispy-doom.cfg',
          '-savedir', '/doom1-saves/', '-window', '-geometry', geometry()]);
      } catch (e) { if (String(e).indexOf('unwind') < 0) L('ERROR: ' + e); }
      setInterval(() => A.sync(false), 4000);
      document.addEventListener('visibilitychange', () => { if (document.hidden) A.sync(false); });
      addEventListener('pagehide', () => A.sync(false));
      [300, 1500, 4000].forEach(t => setTimeout(() => { unlockAudio(); const c = Module.SDL2 && Module.SDL2.audioContext; L('audio: ' + (c ? c.state : 'sin contexto')); }, t));
    } catch (e) { msg.textContent = 'Error: ' + e; }
  }
};

/* ---------- Entrada ---------- */
const cnt = {};
function key(id, p) {
  const before = cnt[id] || 0;
  const after = Math.max(0, before + (p ? 1 : -1));
  cnt[id] = after;
  if ((before === 0) !== (after === 0)) {
    try { Module.ccall('alpine_key', null, ['number', 'number'], [id, after > 0 ? 1 : 0]); } catch (e) {}
  }
}
function releaseAll() { for (const id in cnt) { if (cnt[id] > 0) { cnt[id] = 1; key(+id, 0); } } }
function axis(x, y) { try { Module.ccall('alpine_move', null, ['number', 'number'], [x, y]); } catch (e) {} }
function look(dx) { try { Module.ccall('alpine_look', null, ['number'], [dx]); } catch (e) {} }

// Botón Atrás del sistema: abre/cierra el menú de Doom (Esc). Dos veces seguidas (en menos de 0.7 s) cierra la app.
let lastBack = 0;
window.alpineBack = function () {
  const now = Date.now();
  if (now - lastBack < 700) return false;
  lastBack = now;
  key(10, 1); setTimeout(() => key(10, 0), 80);
  return true;
};

/* ---------- Controles (posición = centro, en fracción de pantalla) ---------- */
const CTRL = [
  { id: 'joy', t: 'joy', label: 'Joystick', x: .15, y: .66, size: 150 },
  { id: 'fire', k: 4, label: 'FUEGO', cls: 'pk', x: .90, y: .66, size: 100 },
  { id: 'use', k: 5, label: 'USAR', cls: 'bl', x: .76, y: .84, size: 64 },
  { id: 'run', k: 6, label: 'CORRER', x: .76, y: .58, size: 64 },
  { id: 'esc', k: 10, label: 'MENÚ', name: 'Menú', x: .95, y: .09, size: 48, sq: 1 },
  { id: 'ok', k: 9, label: 'OK', name: 'Aceptar (Enter)', x: .89, y: .09, size: 48, sq: 1 },
  { id: 'map', k: 11, label: 'MAPA', name: 'Mapa', x: .83, y: .09, size: 48, sq: 1 },
  { id: 'yes', k: 12, label: 'SÍ', name: 'Sí (Y)', x: .77, y: .09, size: 48, sq: 1 },
  { id: 'no', k: 13, label: 'NO', name: 'No (N)', x: .71, y: .09, size: 48, sq: 1 },
  { id: 'save', k: 14, label: 'GUARD', name: 'Guardar partida (F6)', x: .65, y: .09, size: 48, sq: 1 },
  { id: 'load', k: 15, label: 'CARGA', name: 'Cargar partida (F9)', x: .59, y: .09, size: 48, sq: 1 },
];
for (let i = 0; i < 7; i++) CTRL.push({ id: 'w' + (i + 1), k: 20 + i, label: String(i + 1), name: 'Arma ' + (i + 1), x: .04 + i * .055, y: .09, size: 44, sq: 1 });
CTRL.forEach(c => { c.s = 1; c.h = false; c.name = c.name || c.label; });

let op = 1, camMode = 0, sens = 6, editing = false, sel = null, drag = null;
const LS = 'doom1-layout-v2';
const $ = id => document.getElementById(id);
const clamp = v => Math.min(.98, Math.max(.02, v));

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!d) return;
    op = d.op || 1; camMode = d.cm || 0; sens = d.sens || 6;
    CTRL.forEach(c => { const v = d.c && d.c[c.id]; if (v) { c.x = v.x; c.y = v.y; c.s = v.s; c.h = v.h; } });
  } catch (e) {}
}
function save() {
  try {
    const c = {}; CTRL.forEach(k => c[k.id] = { x: k.x, y: k.y, s: k.s, h: k.h });
    localStorage.setItem(LS, JSON.stringify({ op, cm: camMode, sens, c }));
  } catch (e) {}
}
function apply(c) {
  const el = c.el, d = c.size * c.s;
  el.style.left = c.x * innerWidth + 'px';
  el.style.top = c.y * innerHeight + 'px';
  el.style.width = el.style.height = d + 'px';
  el.style.fontSize = d * (c.label.length > 4 ? .2 : c.label.length > 2 ? .25 : .3) + 'px';
  el.style.display = (c.h && !editing) ? 'none' : 'flex';
  el.style.opacity = editing ? (c.h ? .3 : 1) : op;
}

/* ---------- Construcción ---------- */
CTRL.forEach(c => {
  const el = c.el = document.createElement('div');
  el.className = 'b' + (c.sq ? ' sq' : '') + (c.t === 'joy' ? ' joy' : '') + (c.cls ? ' ' + c.cls : '');
  if (c.t === 'joy') {
    const kn = c.knob = document.createElement('div');
    kn.className = 'knob';
    kn.style.transform = 'translate(-50%,-50%)';
    el.appendChild(kn);
    // Joystick analógico: la velocidad depende de cuánto lo inclines.
    c.joyMove = e => {
      const r = el.getBoundingClientRect(), rad = r.width / 2;
      let dx = e.clientX - (r.left + rad), dy = e.clientY - (r.top + rad);
      const max = rad * .45, dist = Math.hypot(dx, dy);
      if (dist > max) { dx *= max / dist; dy *= max / dist; }
      kn.style.transform = 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px))';
      let nx = dx / max, ny = dy / max;
      const m = Math.hypot(nx, ny);
      if (m < .12) { nx = ny = 0; } else { const k = (m - .12) / .88 / m; nx *= k; ny *= k; }
      axis(nx, -ny);
    };
    c.joyEnd = () => { kn.style.transform = 'translate(-50%,-50%)'; axis(0, 0); };
  } else el.textContent = c.label;
  document.body.appendChild(el);

  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    if (editing) { select(c); drag = { c, ox: e.clientX - c.x * innerWidth, oy: e.clientY - c.y * innerHeight }; return; }
    if (c.t === 'joy') c.joyMove(e); else { el.classList.add('on'); key(c.k, 1); }
  });
  el.addEventListener('pointermove', e => {
    if (editing) {
      if (drag && drag.c === c) { c.x = clamp((e.clientX - drag.ox) / innerWidth); c.y = clamp((e.clientY - drag.oy) / innerHeight); apply(c); }
    } else if (c.t === 'joy' && e.buttons) c.joyMove(e);
  });
  const up = e => {
    e.preventDefault();
    if (editing) { if (drag) { drag = null; save(); } return; }
    if (c.t === 'joy') c.joyEnd(); else { el.classList.remove('on'); key(c.k, 0); }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
});

/* ---------- Joystick flotante: toca en cualquier punto de la izquierda ---------- */
const J = CTRL.find(c => c.t === 'joy');
const jz = document.createElement('div');
jz.id = 'jz';
document.body.appendChild(jz);
let jid = null;
jz.addEventListener('pointerdown', e => {
  if (editing || jid !== null) return;
  e.preventDefault(); jz.setPointerCapture(e.pointerId); jid = e.pointerId;
  J.el.style.left = e.clientX + 'px'; J.el.style.top = e.clientY + 'px'; J.el.style.display = 'flex';
  J.joyMove(e);
});
jz.addEventListener('pointermove', e => { if (e.pointerId === jid) J.joyMove(e); });
const jEnd = e => { if (e.pointerId !== jid) return; jid = null; J.joyEnd(); apply(J); };
jz.addEventListener('pointerup', jEnd);
jz.addEventListener('pointercancel', jEnd);

/* ---------- Cámara: arrastra a la derecha (como un ratón) ---------- */
const cam = document.createElement('div');
cam.id = 'cam';
document.body.appendChild(cam);
const cs = { id: null, x0: 0, px: 0, l: 0, r: 0, f: 0 };
function camSet(l, r, f) {
  if (cs.l !== l) { cs.l = l; key(0, l); }
  if (cs.r !== r) { cs.r = r; key(1, r); }
  if (cs.f !== f) { cs.f = f; key(6, f); }
}
cam.addEventListener('pointerdown', e => {
  if (editing || cs.id !== null) return;
  e.preventDefault(); cam.setPointerCapture(e.pointerId);
  cs.id = e.pointerId; cs.x0 = cs.px = e.clientX;
});
cam.addEventListener('pointermove', e => {
  if (e.pointerId !== cs.id) return;
  if (camMode === 0) {
    look((e.clientX - cs.px) * sens);
    cs.px = e.clientX;
  } else {
    const dx = e.clientX - cs.x0, a = Math.abs(dx), t = a > 14;
    camSet(t && dx < 0 ? 1 : 0, t && dx > 0 ? 1 : 0, a > 80 ? 1 : 0);
  }
});
const camEnd = e => { if (e.pointerId !== cs.id) return; cs.id = null; camSet(0, 0, 0); };
cam.addEventListener('pointerup', camEnd);
cam.addEventListener('pointercancel', camEnd);

/* ---------- Modo edición ---------- */
function select(c) {
  sel = c;
  CTRL.forEach(k => k.el.classList.toggle('sel', k === c));
  $('pname').textContent = c.name;
  $('psize').value = c.s * 100;
  $('phide').textContent = c.h ? 'Mostrar' : 'Ocultar';
}
function setEdit(on) {
  editing = on; drag = null;
  releaseAll(); camSet(0, 0, 0); cs.id = null; jid = null; axis(0, 0);
  CTRL.forEach(c => { if (c.t === 'joy') c.knob.style.transform = 'translate(-50%,-50%)'; c.el.classList.remove('on'); });
  document.body.classList.toggle('edit', on);
  $('panel').hidden = !on;
  $('gear').hidden = on;
  if (!on) { sel = null; CTRL.forEach(k => k.el.classList.remove('sel')); $('pname').textContent = 'Toca un control para editarlo'; }
  CTRL.forEach(apply);
}
const camLabel = () => { $('pcam').textContent = 'Cámara: ' + (camMode ? 'digital' : 'analógica'); };
$('gear').addEventListener('pointerdown', e => { e.preventDefault(); setEdit(true); });
$('pcam').onclick = () => { camMode = camMode ? 0 : 1; camLabel(); save(); };
$('psens').oninput = e => { sens = +e.target.value; save(); };
$('pdone').onclick = () => { save(); setEdit(false); };
$('psize').oninput = e => { if (sel) { sel.s = e.target.value / 100; apply(sel); save(); } };
$('pop').oninput = e => { op = e.target.value / 100; save(); };
$('phide').onclick = () => { if (sel) { sel.h = !sel.h; apply(sel); select(sel); save(); } };
$('preset').onclick = () => {
  try { localStorage.removeItem(LS); } catch (e) {}
  location.reload();
};
addEventListener('resize', () => { CTRL.forEach(apply); });

load();
$('pop').value = op * 100;
$('psens').value = sens;
camLabel();
const scrLabel = () => { $('pscr').textContent = 'Pantalla: ' + (curMode() === '43' ? '4:3' : 'completa (sin estirar)'); };
$('pscr').onclick = () => { localStorage.setItem('doom1-mode', curMode() === '43' ? 'full' : '43'); location.reload(); };
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsLabel = () => { $('pfs').textContent = fsEl() ? 'Salir de pantalla completa' : 'Pantalla completa'; };
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('pfs').hidden = true;
$('pfs').onclick = () => {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch(() => {});
    else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement).catch(() => {});
  } catch (e) {}
  setTimeout(fsLabel, 300);
};
document.addEventListener('fullscreenchange', fsLabel);
document.addEventListener('webkitfullscreenchange', fsLabel);
fsLabel();
scrLabel();
CTRL.forEach(apply);
$('plog').onclick = () => { logFilter = null; logOn = !logOn; if (logOn) showLog(); else logEl.textContent = ''; };
$('psnd').onclick = () => { logFilter = /snd|sound|music|opl|audio|mix|sdl|midi|wipe|transici|save|guard/i; logOn = true; showLog(); };
</script>
<script src="doom.js" onerror="msg.textContent='No cargó doom.js (¿falta en el zip?)'">L('Diagnóstico: JS cargado · controles: ' + CTRL.length + ' · ventana ' + innerWidth + 'x' + innerHeight);
setTimeout(() => L('Diagnóstico 10 s · canvas ' + cvs.width + 'x' + cvs.height + ' · cargando: ' + (document.getElementById('msg') ? 'sí' : 'no')), 10000);
